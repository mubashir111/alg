<!DOCTYPE html>
<html>
<head>
<title>Grid Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
</style>
</head>
<body>
<div style="width:100%;height:400px;">
  <div id="grid" style="display:grid; height:100%; width:100%; overflow:hidden; grid-template-columns: 50fr 10fr 10fr 10fr 10fr; transition: grid-template-columns 700ms cubic-bezier(0.22, 1, 0.36, 1);">
    
    <div style="position:relative;overflow:hidden;min-width:0;">
      <div id="arrow-0" style="position:absolute;inset:0;background:#7FC5D8;transition:opacity 500ms;opacity:0;pointer-events:none;padding:20px;">
        <span style="color:#fff;font-size:30px;">↘</span>
      </div>
      <div id="content-0" style="position:absolute;inset:0;background:#4a9bb2;transition:opacity 500ms, transform 500ms;opacity:1;transform:translateY(0);pointer-events:none;padding:20px;display:flex;align-items:flex-end;">
        <span style="color:#fff;font-size:40px;font-weight:bold;">135+<br><small>Airline Partners</small></span>
      </div>
      <div class="hit" data-index="0" style="position:absolute;inset:0;z-index:10;cursor:pointer;"></div>
    </div>

    <div style="position:relative;overflow:hidden;min-width:0;">
      <div id="arrow-1" style="position:absolute;inset:0;background:#36A5C2;transition:opacity 500ms;opacity:1;pointer-events:none;padding:20px;">
        <span style="color:#fff;font-size:30px;">↘</span>
      </div>
      <div id="content-1" style="position:absolute;inset:0;background:#2a8a9f;transition:opacity 500ms, transform 500ms;opacity:0;transform:translateY(24px);pointer-events:none;padding:20px;display:flex;align-items:flex-end;">
        <span style="color:#fff;font-size:40px;font-weight:bold;">100<br><small>Offices</small></span>
      </div>
      <div class="hit" data-index="1" style="position:absolute;inset:0;z-index:10;cursor:pointer;"></div>
    </div>

    <div style="position:relative;overflow:hidden;min-width:0;">
      <div id="arrow-2" style="position:absolute;inset:0;background:#26758B;transition:opacity 500ms;opacity:1;pointer-events:none;padding:20px;">
        <span style="color:#fff;font-size:30px;">↘</span>
      </div>
      <div id="content-2" style="position:absolute;inset:0;background:#1c6070;transition:opacity 500ms, transform 500ms;opacity:0;transform:translateY(24px);pointer-events:none;padding:20px;display:flex;align-items:flex-end;">
        <span style="color:#fff;font-size:40px;font-weight:bold;">60+<br><small>Countries</small></span>
      </div>
      <div class="hit" data-index="2" style="position:absolute;inset:0;z-index:10;cursor:pointer;"></div>
    </div>

    <div style="position:relative;overflow:hidden;min-width:0;">
      <div id="arrow-3" style="position:absolute;inset:0;background:#174958;transition:opacity 500ms;opacity:1;pointer-events:none;padding:20px;">
        <span style="color:#fff;font-size:30px;">↘</span>
      </div>
      <div id="content-3" style="position:absolute;inset:0;background:#0f3a45;transition:opacity 500ms, transform 500ms;opacity:0;transform:translateY(24px);pointer-events:none;padding:20px;display:flex;align-items:flex-end;">
        <span style="color:#fff;font-size:40px;font-weight:bold;">$500M+<br><small>Annual Sales</small></span>
      </div>
      <div class="hit" data-index="3" style="position:absolute;inset:0;z-index:10;cursor:pointer;"></div>
    </div>

    <div style="position:relative;overflow:hidden;min-width:0;">
      <div id="arrow-4" style="position:absolute;inset:0;background:#103440;transition:opacity 500ms;opacity:1;pointer-events:none;padding:20px;">
        <span style="color:#fff;font-size:30px;">↘</span>
      </div>
      <div id="content-4" style="position:absolute;inset:0;background:#0a2530;transition:opacity 500ms, transform 500ms;opacity:0;transform:translateY(24px);pointer-events:none;padding:20px;display:flex;align-items:flex-end;">
        <span style="color:#fff;font-size:40px;font-weight:bold;">550,000+<br><small>AWBs Annually</small></span>
      </div>
      <div class="hit" data-index="4" style="position:absolute;inset:0;z-index:10;cursor:pointer;"></div>
    </div>

  </div>
</div>

<script>
(function() {
    var hoveredIndex = 0;
    var grid = document.getElementById('grid');

    function update() {
        var cols = [];
        for (var i = 0; i < 5; i++) cols.push(i === hoveredIndex ? '50fr' : '10fr');
        grid.style.gridTemplateColumns = cols.join(' ');
        for (var i = 0; i < 5; i++) {
            var a = document.getElementById('arrow-' + i);
            var c = document.getElementById('content-' + i);
            if (a) a.style.opacity = (i === hoveredIndex) ? '0' : '1';
            if (c) {
                c.style.opacity = (i === hoveredIndex) ? '1' : '0';
                c.style.transform = (i === hoveredIndex) ? 'translateY(0)' : 'translateY(24px)';
            }
        }
    }

    var hits = grid.querySelectorAll('.hit');
    for (var i = 0; i < hits.length; i++) {
        (function(el) {
            el.addEventListener('mouseenter', function() {
                var idx = parseInt(el.getAttribute('data-index'), 10);
                if (idx !== hoveredIndex) { hoveredIndex = idx; update(); }
            });
        })(hits[i]);
    }

    grid.addEventListener('mouseleave', function() {
        setTimeout(function() { hoveredIndex = 0; update(); }, 150);
    });

    update();
})();
</script>
</body>
</html>
